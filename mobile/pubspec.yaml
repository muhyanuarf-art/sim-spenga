name: sim_spenga
description: Aplikasi Android SIM-SPENGA — SMP Negeri 3 Bumiayu.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView: seluruh aplikasi web ditampilkan di dalamnya sesudah masuk.
  webview_flutter: ^4.10.0

  # Dibutuhkan untuk menyetel mode komposisi WebView khusus Android —
  # tanpa ini gulir terasa tersendat karena tiap frame disalin ke tekstur.
  webview_flutter_android: ^4.14.1

  # Untuk satu permintaan saja — menukar kredensial dengan tautan masuk.
  http: ^1.2.2

  # Menyimpan alamat server & email terakhir. TIDAK menyimpan kata sandi.
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8
  local_auth: ^3.0.2
  flutter_secure_storage: 10.0.0
  local_auth_android: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# ===== IKON PELUNCUR ANDROID =====
# Sumbernya lambang SMP Negeri 3 Bumiayu — berkas yang sama yang dipakai
# situs web sebagai ikon (storage/app/public/ikon). Kalau sekolah nanti
# mengganti Logo Aplikasi lewat menu Pengaturan Sekolah, salin ulang
# berkas itu ke assets/ikon/logo_sekolah.png lalu jalankan:
#
#   dart run flutter_launcher_icons
#
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/ikon/logo_sekolah.png"
  min_sdk_android: 24

  # Android memangkas ikon adaptif jadi lingkaran atau kotak membulat,
  # sesuai peluncur masing-masing ponsel. Lambang ini kelopaknya menyentuh
  # tepi kanvas, jadi diberi ruang 18% supaya tidak ada yang terpotong.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/ikon/logo_sekolah.png"
  adaptive_icon_foreground_inset: 18
